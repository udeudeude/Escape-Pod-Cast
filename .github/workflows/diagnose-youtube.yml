name: Diagnose YouTube extraction
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique diagnosis request identifier
        required: true
        type: string
      url:
        description: Public YouTube video URL for metadata-only diagnosis
        required: true
        type: string
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install supported extractor and token provider
        run: |
          python -m pip install --upgrade yt-dlp bgutil-ytdlp-pot-provider
          git clone --depth 1 --branch 2.0.2 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil
          cd /tmp/bgutil/server
          npm ci
          npx tsc
      - name: Diagnose without downloading or account credentials
        env:
          VIDEO_URL: ${{ inputs.url }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          node /tmp/bgutil/server/build/main.js > /tmp/bgutil.log 2>&1 &
          sleep 3
          python3 scripts/diagnose_youtube.py
      - name: Publish diagnostic result
        if: always()
        run: |
          if [ ! -d docs/diagnostics ]; then exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics
          if git diff --cached --quiet; then exit 1; fi
          git commit -m "Store YouTube diagnostic result"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || exit 1
            sleep $((attempt * 2))
          done
          exit 1
