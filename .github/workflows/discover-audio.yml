name: Discover webpage audio
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
        type: string
      request_id:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: escape-pod-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect page
        env:
          PAGE_URL: ${{ inputs.url }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python3 scripts/discover_audio_page.py
      - name: Publish discovery result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/discovery
          git commit -m "Store audio discovery result"
          git pull --rebase origin main
          git push origin HEAD:main
