name: Import direct audio link
on:
  workflow_dispatch:
    inputs:
      url:
        description: Public HTTPS audio URL
        required: true
        type: string
      title:
        description: Optional title
        required: false
        type: string
      description:
        description: Optional description
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: escape-pod-publisher
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publish with conflict-safe retries
        env:
          EPISODE_URL: ${{ inputs.url }}
          EPISODE_TITLE: ${{ inputs.title }}
          EPISODE_DESCRIPTION: ${{ inputs.description }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/import_audio_link_action.py
            git add docs/feed.xml docs/feeds
            if git diff --cached --quiet; then
              echo "Recording already published"
              exit 0
            fi
            git commit -m "Publish direct audio link"
            if git push origin HEAD:main; then
              echo "Episode published successfully"
              exit 0
            fi
            echo "Feed changed during publication; retrying with latest version ($attempt/5)"
            sleep $((attempt * 2))
          done
          echo "Unable to publish after five retries"
          exit 1
