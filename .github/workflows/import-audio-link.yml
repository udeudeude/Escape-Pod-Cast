name: Import direct audio link
on:
  workflow_dispatch:
    inputs:
      url:
        description: Public HTTPS audio URL
        required: true
        type: string
      title:
        description: Optional title
        required: false
        type: string
      description:
        description: Optional description
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: escape-pod-publisher
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect and prepare podcast feed
        env:
          EPISODE_URL: ${{ inputs.url }}
          EPISODE_TITLE: ${{ inputs.title }}
          EPISODE_DESCRIPTION: ${{ inputs.description }}
        run: python3 scripts/import_audio_link_action.py
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feeds docs/feed.xml
          if git diff --cached --quiet; then echo "Audio already published"; exit 0; fi
          git commit -m "Publish direct audio link"
          git pull --rebase origin main
          git push origin HEAD:main
