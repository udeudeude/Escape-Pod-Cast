name: Publish podcast cover
on:
  push:
    branches: [main]
    paths:
      - docs/assets/escape-pod-cover.svg
      - scripts/publish_cover.py
      - .github/workflows/publish-cover.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: escape-pod-publisher
  cancel-in-progress: false
jobs:
  cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'cairosvg==2.7.1'
      - name: Render artwork and update feeds
        run: python scripts/publish_cover.py
      - name: Commit published cover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/escape-pod-cover.png docs/feed.xml docs/feeds
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish podcast cover PNG and feed artwork metadata"
          git pull --rebase origin main
          git push origin HEAD:main
