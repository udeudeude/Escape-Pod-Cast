services:
  - type: web
    name: escape-pod-cast
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_PASSWORD
        sync: false
      - key: FEED_TOKEN
        generateValue: true
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: SHOW_TITLE
        value: Escape Pod Cast
      - key: SHOW_DESCRIPTION
        value: My personal audio feed.
      - key: AUTHOR
        value: Personal
      - key: MAX_UPLOAD_MB
        value: 300
